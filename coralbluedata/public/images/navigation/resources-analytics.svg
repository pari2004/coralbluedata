<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" role="img" aria-label="Floating analytics panels with charts and report pages" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<radialGradient id="bg" cx="55%" cy="45%" r="80%"><stop offset="0" stop-color="#0c2a4d"/><stop offset="1" stop-color="#040c1a"/></radialGradient>
<linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1e3a5f" stroke-width="1" opacity=".45"/></pattern>
</defs>
<style>
.p{animation:pulse 3s ease-in-out infinite} .d{stroke-dasharray:6 10;animation:dash 3s linear infinite}
.fl{animation:float 6s ease-in-out infinite alternate}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}} @keyframes dash{to{stroke-dashoffset:-64}}
@keyframes float{to{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){.p,.d,.fl{animation:none}}
</style>
